name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      # `flutterfire configure` applies the google-services Gradle plugin, which
      # refuses to build without android/app/google-services.json — and that file
      # is git-ignored (no project secrets in the repo). The app initialises
      # FlutterFire explicitly from lib/firebase_options.dart and never reads
      # this file at runtime, so a fake one is enough to get past the plugin.
      - name: Provide a placeholder google-services.json
        run: cp tool/ci_google_services_placeholder.json android/app/google-services.json

      # Android is the priority target for the initial version.
      - run: flutter build apk --debug
      # Web rides along as a quick secondary smoke build.
      - run: flutter build web --release

  functions:
    name: Cloud Functions (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # The dispatcher's pure logic (timing, recurrence, carry-forward) mirrors
      # the Dart client by hand — these tests are what keeps the two in step.
      - run: npm test

  functions-integration:
    name: Cloud Functions (Firestore emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator needs a JRE; firebase-tools requires JDK 21+.
      # Independent of the Flutter job, which is pinned to JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # The emulators:exec script calls the global `firebase` binary, matching
      # the project's serve/deploy scripts (setup docs install it globally too).
      - run: npm i -g firebase-tools
      # Exercises the real Firestore queries + the atomic once-per-day claim
      # against the emulator — the parts the pure unit tests can't cover.
      - run: npm run test:integration
